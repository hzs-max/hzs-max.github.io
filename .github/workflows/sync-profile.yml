name: Sync profile from dpaste
on:
  push:
    paths:
      - .github/workflows/sync-profile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download updated index.html
        run: |
          curl -fsSL 'https://dpaste.org/iE0NE/raw' -o index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update profile: interactive avatar, abstract art, vlog gallery' || echo 'No changes to commit'
          git push
